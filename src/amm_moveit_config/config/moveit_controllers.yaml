# ============================================================
# AUTONOMOUS MOBILE MANIPULATOR
# CONTROLADORES MOVEIT 2
# ============================================================

# Gestor encargado de conectar MoveIt con ros2_control.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:

  controller_names:
    - joint_trajectory_controller
    - gripper_controller

  # ----------------------------------------------------------
  # CONTROLADOR DEL BRAZO UR5E
  # ----------------------------------------------------------

  joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true

    joints:
      - ur5e_shoulder_pan_joint
      - ur5e_shoulder_lift_joint
      - ur5e_elbow_joint
      - ur5e_wrist_1_joint
      - ur5e_wrist_2_joint
      - ur5e_wrist_3_joint

  # ----------------------------------------------------------
  # CONTROLADOR DE LA PINZA ROBOTIQ 2F-85
  # ----------------------------------------------------------

  # La pinza utiliza la acción ParallelGripperCommand.
  # Las demás articulaciones deben seguir correctamente
  # el movimiento de la articulación principal.

  gripper_controller:
    type: ParallelGripperCommand
    action_ns: gripper_cmd
    default: true

    joints:
      - gripper_robotiq_85_left_knuckle_joint
